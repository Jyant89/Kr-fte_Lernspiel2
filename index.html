<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kraftlabor – Meistere die Kräfte</title>
<style>
:root{
  --bg:#0c1420; --panel:#142032; --panel2:#1a2a40; --line:#2a3d58;
  --text:#eaf1fb; --muted:#a3b4cb; --accent:#3ddc97; --accent-ink:#04261a;
  --bad:#ff7b7b; --hint:#ffd166; --info:#7cc4ff;
  --fR:#ff9f43; --fL:#38bdf8; --fV:#facc15; --fRes:#c084fc;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;min-height:100vh;color:var(--text);line-height:1.5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#16304d 0%,transparent 60%),var(--bg);}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
h1{font-size:1.7rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:.4em 0 .8em}
a{color:var(--info)}
.skip{position:absolute;left:-999px;top:0;background:#fff;color:#000;padding:8px}
.skip:focus{left:8px;z-index:99}
button{font:inherit;min-height:48px;border-radius:12px;border:2px solid var(--line);
  background:var(--panel2);color:var(--text);padding:.45rem 1rem;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:#4b6488}
button:focus-visible,input:focus-visible,textarea:focus-visible,.term:focus-visible{outline:3px solid var(--hint);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.primary:hover:not(:disabled){filter:brightness(1.08);border-color:var(--accent)}
.secondary{background:#22344f}
.ghost{background:transparent}
.pulse{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,220,151,.0)}50%{box-shadow:0 0 0 8px rgba(61,220,151,.25)}}
input[type=range]{width:100%;accent-color:var(--accent);min-height:36px}
input[type=number],input[type=text],textarea{font:inherit;background:#0e1928;color:var(--text);border:2px solid var(--line);border-radius:10px;padding:.4rem .6rem}
input[type=number]{width:5.2em;text-align:center}
textarea{width:100%;resize:vertical}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* Kopfzeile */
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;
  padding:.5rem 16px;background:rgba(12,20,32,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.brand{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:.4rem}
.logo{color:var(--accent);font-size:1.4rem}
.steps{display:flex;flex-wrap:wrap;gap:.35rem;list-style:none;margin:0;padding:0;flex:1}
.steps li{font-size:.75rem;padding:.2rem .55rem;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.steps li.done{border-color:var(--accent);color:var(--accent)}
.tools{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.tools button{min-height:40px;padding:.3rem .7rem;font-size:.9rem}
.xp{font-weight:700;padding:.3rem .7rem;border-radius:99px;background:#2a2410;border:1px solid #6b5a1c;color:#ffe08a}

main{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
main:focus{outline:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.2rem 1.3rem;margin-bottom:1rem}
.narrow{max-width:760px;margin-left:auto;margin-right:auto}
.kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.lead{font-size:1.1rem}

/* Arbeitsauftrag */
.task{display:flex;gap:.7rem;align-items:flex-start;background:#1b3049;border-left:6px solid var(--info);
  border-radius:12px;padding:.75rem .9rem;margin:.6rem 0 .9rem;font-size:1.05rem}
.tasktext{flex:1}
.say{min-height:40px;min-width:44px;padding:.2rem .5rem;font-size:1.05rem;background:#14263c}
.no-speech .say{display:none}
.term{font:inherit;background:none;border:none;border-bottom:2px dotted var(--hint);color:var(--hint);
  padding:0;min-height:0;border-radius:0;cursor:help}

/* Antworten */
.opts{display:grid;gap:.55rem;margin:.6rem 0}
.opt{display:flex;align-items:center;gap:.75rem;text-align:left;width:100%;padding:.6rem .9rem}
.optkey{flex:0 0 auto;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:#0e1928;font-weight:700;font-size:.9rem}
.opt.sel{border-color:var(--info);background:#173252}
.opt.correct{border-color:var(--accent);background:rgba(61,220,151,.16)}
.opt.correct .optkey{background:var(--accent);color:var(--accent-ink)}
.opt.wrong{border-color:var(--bad);background:rgba(255,123,123,.10);text-decoration:line-through;opacity:.75}
.starter{background:#1d2b1f;border:1px dashed #4a7a52;border-radius:10px;padding:.5rem .8rem}

/* Meldungen */
.msg{border-radius:12px;padding:.65rem .9rem;margin:.5rem 0;border:2px solid}
.msg.good{border-color:var(--accent);background:rgba(61,220,151,.10)}
.msg.bad{border-color:var(--bad);background:rgba(255,123,123,.08)}
.msg.hint{border-color:var(--hint);background:rgba(255,209,102,.09)}
.msg.info{border-color:var(--info);background:rgba(124,196,255,.09)}
.twin-note{display:inline-block;background:#2b2140;border:1px solid #7a5ab8;color:#e4d4ff;border-radius:99px;padding:.2rem .8rem;font-size:.9rem;margin-bottom:.3rem}
.termcard{display:flex;gap:.8rem;align-items:center;background:#2a2410;border:2px solid #8a7426;border-radius:14px;padding:.7rem 1rem;margin:.6rem 0}
.termcard .ti{font-size:2rem}
.termcard b{color:#ffe08a;font-size:1.15rem}

/* Szenen und SVG */
.scene{margin:.6rem 0;text-align:center}
.scene svg,.simsvg,.labsvg,.fsvg,.chain{width:100%;height:auto;display:block;background:#0f1b2b;border:1px solid var(--line);border-radius:14px}
.scene .play{margin-top:.5rem}
.emoji-scene{font-size:3.4rem;background:#0f1b2b;border:1px solid var(--line);border-radius:14px;padding:.6rem}
.vis{margin-top:.5rem}
.vislabel{font-size:.9rem;color:var(--muted);margin:.3rem 0}

/* Steuerelemente */
.seg{display:inline-flex;flex-wrap:wrap;gap:.4rem}
.seg button[aria-pressed=true]{border-color:var(--info);background:#18406a;font-weight:700}
.seg.big button{min-width:9rem}
.stepper{display:inline-flex;align-items:center;gap:.35rem}
.sbtn{min-width:48px;font-size:1.3rem;padding:0}
.unit{font-weight:700;margin-left:.3rem}
.plabel{font-weight:700;margin:.7rem 0 .35rem}
.numrow{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.btnrow{display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0}
.respick{margin:.4rem 0}
.respick .chk{margin-top:.9rem}

/* Kräfte-Regler */
.fpanel{display:grid;gap:.5rem;margin:.8rem 0}
.frow{display:grid;grid-template-columns:3.4rem auto 1fr 3.8rem 1.4rem;gap:.6rem;align-items:center;
  background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:.4rem .7rem}
.frow.dirR{border-left:8px solid var(--fR)} .frow.dirL{border-left:8px solid var(--fL)}
.frow .fname{font-weight:800}
.frow output{font-weight:800;text-align:right}
.frow .lock{visibility:hidden} .frow.locked .lock{visibility:visible}
.frow .seg button{min-height:42px;padding:.2rem .6rem;font-size:.9rem}

/* Simulation */
.sim{display:grid;grid-template-columns:1fr 250px;gap:.8rem;align-items:start;margin:.6rem 0}
.simside{display:grid;gap:.6rem}
.sim.nograph{grid-template-columns:1fr}
.speedo,.graphbox{background:#0f1b2b;border:1px solid var(--line);border-radius:14px;padding:.55rem .7rem}
.sp-top{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem}
.sp-top span{color:var(--muted);font-size:.85rem}
.sp-val{font-size:1rem}
.vbar{position:relative;height:14px;background:#1e2d43;border-radius:7px;margin:.4rem 0 .2rem;overflow:hidden}
.vfill{position:absolute;top:0;height:100%;background:#e2e8f0;border-radius:7px;left:50%;width:0}
.vzero{position:absolute;left:50%;top:-2px;width:2px;height:18px;background:#ffd166}
.sp-cap,.glabel{font-size:.75rem;color:var(--muted)}
.graph{width:100%;height:auto;display:block}
.phase{border-top:2px dashed var(--line);margin-top:1.1rem;padding-top:.8rem;scroll-margin-top:90px}
.phase h3{color:var(--info)}
.cmp{border-collapse:collapse;margin:.5rem 0;width:100%}
.cmp td,.cmp th{border:1px solid var(--line);padding:.4rem .6rem;text-align:left}
.cmp th{background:#1a2a40}

/* Kraftpfeil-Labor */
.lab2{display:grid;grid-template-columns:1fr 320px;gap:1rem;align-items:start}
.labsvg{touch-action:none}
.ctrls fieldset{border:2px solid var(--line);border-radius:12px;margin:0 0 .7rem;padding:.5rem .7rem .7rem}
.ctrls fieldset.locked{opacity:.6}
.ctrls legend{font-weight:700;padding:0 .3rem}
.ctrls .seg button{min-width:5.6rem}
.readout{font-weight:800;margin-top:.3rem}

/* Felder */
.fields{display:grid;gap:.5rem;margin:.6rem 0}
.fld{display:grid;grid-template-columns:1fr auto;gap:.3rem .8rem;align-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:.55rem .8rem}
.fld.ok{border-color:var(--accent)} .fld.bad{border-color:var(--bad)}
.fldres{grid-column:1/-1;font-size:.95rem}
.fldres:empty{display:none}

/* Begründung */
.reason{margin-top:.8rem;background:#16263b;border:1px solid var(--line);border-radius:14px;padding:.7rem .9rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.chips button{min-height:38px;font-size:.9rem;padding:.2rem .7rem;background:#1d2b1f;border-color:#4a7a52}

/* Missionen */
.mhead{display:flex;gap:1rem;align-items:center;margin-bottom:.4rem}
.mtitle{margin:0;font-size:1.4rem}
.pbar{height:10px;background:#1c2b41;border-radius:6px;overflow:hidden;margin:.5rem 0 .2rem}
.pbar div{height:100%;background:linear-gradient(90deg,var(--accent),#7ce8bd);transition:width .4s}
.pstep{font-size:.85rem;color:var(--muted);margin-bottom:.6rem}
.nav{display:flex;justify-content:flex-end;margin-top:1rem}
.nav .primary{min-width:12rem;font-size:1.05rem}
.mgrid{display:grid;gap:.8rem}
.mcard{display:grid;grid-template-columns:4rem 1fr auto;gap:1rem;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:1rem}
.mcard.done{border-color:#2f7d5a}
.mcard.locked{opacity:.6}
.micon{font-size:2.6rem;text-align:center}
.mcard h3{margin:.1rem 0}
.mcard p{margin:.1rem 0}
.goal{font-size:.85rem;color:var(--muted)}
.mact{display:grid;gap:.4rem;justify-items:end}
.badge{font-size:.85rem;background:#2a2410;border:1px solid #8a7426;color:#ffe08a;border-radius:99px;padding:.15rem .7rem}
.lamps{display:flex;gap:.5rem;font-size:1.6rem}
.badgebig{font-size:5.5rem;text-align:center;animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.center{text-align:center}
.foot{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.2rem}
.foot button{font-size:.9rem;min-height:42px}

/* Bilanz */
.btable{width:100%;border-collapse:collapse;margin:.6rem 0}
.btable th,.btable td{border:1px solid var(--line);padding:.5rem .6rem;text-align:left;vertical-align:top}
.btable th{background:#1a2a40}
.lv-sicher{color:var(--accent);font-weight:700}
.lv-teilweise{color:var(--hint);font-weight:700}
.lv-unsicher{color:var(--bad);font-weight:700}
.formula{font-family:"Cambria Math","Times New Roman",serif;font-size:1.7rem;text-align:center;background:#0f1b2b;border:2px solid var(--hint);border-radius:14px;padding:.5rem .8rem;margin:.6rem 0}
.formula{font-style:italic}
.formula sub{font-style:normal}
.formula .op{font-style:normal;font-family:system-ui,sans-serif;font-size:1rem;color:var(--hint);margin-left:1rem}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .15em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.schema td:first-child{font-weight:700;width:9rem}
.code{font-family:ui-monospace,Consolas,monospace;background:#0e1928;border:1px solid var(--line);border-radius:8px;padding:.3rem .6rem;display:inline-block}

/* Glossar, Modal, Toast */
.overlay{position:fixed;inset:0;background:rgba(3,8,15,.72);z-index:50;display:grid;place-items:center;padding:16px}
.overlay[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:820px;width:100%;max-height:88vh;overflow:auto;padding:1rem 1.2rem}
.mhead2{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem}
.gcard{display:flex;gap:.7rem;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.6rem}
.gcard p{margin:.2rem 0 0;font-size:.92rem}
.gcard.big{font-size:1.1rem}
.gicon{font-size:1.8rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);background:#1f3d2f;border:2px solid var(--accent);
  color:#d8ffe9;padding:.6rem 1.1rem;border-radius:14px;font-weight:700;z-index:60;transition:transform .3s;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.guide h3{margin-top:1rem;color:var(--info)}
.guide table{border-collapse:collapse;width:100%}
.guide td,.guide th{border:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top;font-size:.92rem}

@media (max-width:820px){
  html{font-size:17px}
  .sim,.lab2{grid-template-columns:1fr}
  .simside{grid-template-columns:1fr 1fr}
  .mcard{grid-template-columns:3rem 1fr}
  .mact{grid-column:1/-1;justify-items:stretch}
  .frow{grid-template-columns:2.8rem 1fr 3.4rem;}
  .frow input[type=range]{grid-column:1/-1;order:5}
  .frow .lock{display:none}
  .seg.big button{min-width:0;flex:1}
}
@media (max-width:480px){ .simside{grid-template-columns:1fr} .steps{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
@media print{
  body{background:#fff;color:#000}
  .topbar,.nav,.foot,.noprint,.toast{display:none!important}
  .card{border:1px solid #999;background:#fff;color:#000}
  .btable th{background:#eee;color:#000}
  .lv-sicher,.lv-teilweise,.lv-unsicher,.muted,.kicker{color:#000}
}
</style>
</head>
<body>
<a class="skip" href="#app">Zum Inhalt springen</a>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">⚛</span><span>Kraftlabor</span></div>
  <ol class="steps" id="steps" aria-label="Fortschritt"></ol>
  <div class="tools">
    <div class="xp" title="Erfahrungspunkte"><span aria-hidden="true">⭐</span> <b id="xp">0</b> XP</div>
    <button type="button" id="btnWords" class="ghost">📖 Wörter</button>
    <button type="button" id="btnHome" class="ghost">🏠 Labor</button>
  </div>
</header>
<main id="app" tabindex="-1"><noscript>Bitte JavaScript im Browser einschalten.</noscript></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="overlay" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead2"><h2 id="mTitle"></h2><button type="button" class="ghost" id="mClose" aria-label="Schließen">✕</button></div>
    <div id="mBody"></div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   Grundfunktionen
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const app=$('#app');
const COL={R:'#ff9f43',L:'#38bdf8',V:'#facc15',RES:'#c084fc'};
const r1=v=>Math.round(v*10)/10;
const fmt=v=>String(r1(v)).replace('.',',');
const fmt2=v=>String(Math.round(v*100)/100).replace('.',',');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function strip(s){return String(s).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function resultant(F){return F.reduce((s,f)=>s+(f.mag?f.dir*f.mag:0),0);}
function dirWord(d){return d>0?'nach rechts':d<0?'nach links':'';}
function resText(R){return R===0?'0 N (kein Pfeil)':`${fmt(Math.abs(R))} N ${dirWord(Math.sign(R))}`;}
function predText(p){if(!p)return '–';return p.dir===0?'0 N (kein Pfeil)':`${fmt(p.mag)} N ${dirWord(p.dir)}`;}
function msg(type,html){return `<div class="msg ${type}">${html}</div>`;}
const PRAISE=['Richtig!','Super!','Genau!','Stark!','Sehr gut!'];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
function focusHeading(){const h=app.querySelector('h1,h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}window.scrollTo(0,0);}

/* =====================================================================
   Spielstand (bleibt während der Sitzung erhalten)
   ===================================================================== */
const CATS={A:'Kraftwirkungen erkennen',B:'Kraftpfeile lesen und zeichnen',C1:'Gleichgerichtete Kräfte addieren',
  C2:'Entgegengesetzte Kräfte verrechnen',C3:'Kräftegleichgewicht und Bewegung',D:'Alltagssituationen analysieren (Transfer)',E:'Gewichtskraft berechnen (F<sub>G</sub> = m · g)'};
function freshState(){return {xp:0,awarded:{},statDone:{},stats:{A:{n:0,ok:0},B:{n:0,ok:0},C1:{n:0,ok:0},C2:{n:0,ok:0},C3:{n:0,ok:0},D:{n:0,ok:0},E:{n:0,ok:0}},
  done:[false,false,false,false,false],badges:[false,false,false,false,false],pre:null,post:null,unlockAll:false};}
const KEY='kraftlabor_v1';
function load(){try{const s=sessionStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function migrate(x){if(!x)return null;try{while(x.done.length<5)x.done.push(false);while(x.badges.length<5)x.badges.push(false);if(!x.stats.E)x.stats.E={n:0,ok:0};return x;}catch(e){return null;}}
let S=migrate(load())||freshState();

function award(id,pts,why){
  if(S.awarded[id]!==undefined)return false;          // keine doppelten Punkte
  S.awarded[id]=pts;
  if(pts>0){S.xp+=pts;toast(`+${pts} XP · ${why}`);}
  updateTop();save();return true;
}
function recordStat(id,cat,firstOk){
  if(!cat||S.statDone[id])return;                    // nur der erste Durchgang zählt
  S.statDone[id]=1;S.stats[cat].n++;if(firstOk)S.stats[cat].ok++;save();
}
function missionUnlocked(i){return S.unlockAll||(!!S.pre&&(i===0||S.done[i-1]));}
function bilanzUnlocked(){return S.unlockAll||S.done[4];}

function updateTop(){
  $('#xp').textContent=S.xp;
  const items=[['Start-Check',!!S.pre],['Mission 1',S.done[0]],['Mission 2',S.done[1]],['Mission 3',S.done[2]],['Mission 4',S.done[3]],['Mission 5',S.done[4]],['Lernbilanz',!!S.post]];
  $('#steps').innerHTML=items.map(([t,d])=>`<li class="${d?'done':''}">${d?'✔ ':''}${t}</li>`).join('');
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* Modal */
let lastFocus=null;
function openModal(title,html){lastFocus=document.activeElement;$('#mTitle').textContent=title;$('#mBody').innerHTML=html;$('#overlay').hidden=false;$('#mClose').focus();}
function closeModal(){$('#overlay').hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
$('#mClose').onclick=closeModal;
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeModal();});

/* =====================================================================
   Wörter-Hilfe (Glossar) und Vorlesen
   ===================================================================== */
const GL={
  kraft:['💪','Kraft','Eine Kraft zieht oder drückt. Man kann sie nicht sehen. Man sieht nur, was sie bewirkt.'],
  newton:['⚖️','Newton (N)','Die Einheit der Kraft. Beispiel: Eine Tafel Schokolade (100 g) drückt mit etwa 1 N auf deine Hand.'],
  wirkung:['✨','Kraftwirkung','Das, was eine Kraft macht: schneller machen, langsamer machen, die Richtung ändern oder die Form ändern.'],
  beschl:['🚀','beschleunigen','schneller werden'],

/* =====================================================================
   Grafik-Helfer (SVG)
   ===================================================================== */
function arrow(x1,y1,x2,y2,color,o={}){
  const w=o.w||6,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);
  if(L<0.5)return '';
  const ux=dx/L,uy=dy/L,hl=Math.min(o.head||18,L*0.7),hw=hl*0.55;
  const bx=x2-ux*hl,by=y2-uy*hl,px=-uy,py=ux;
  const dash=o.dash?` stroke-dasharray="${o.dash}"`:'';
  return `<g><line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(bx)}" y2="${r1(by)}" stroke="${color}" stroke-width="${w}"${dash}/><polygon points="${r1(x2)},${r1(y2)} ${r1(bx+px*hw)},${r1(by+py*hw)} ${r1(bx-px*hw)},${r1(by-py*hw)}" fill="${color}"/></g>`;
}
function gridLines(W,H,step,color='#1c2c42'){let s='';for(let x=0;x<=W;x+=step)s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${color}"/>`;for(let y=0;y<=H;y+=step)s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${color}"/>`;return s;}
function crate(x,y,w,h){return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#b7793f" stroke="#7a4a1e" stroke-width="3"/><line x1="${x+4}" y1="${y+4}" x2="${x+w-4}" y2="${y+h-4}" stroke="#8c5a2b" stroke-width="5"/><line x1="${x}" y1="${y+h/2}" x2="${x+w}" y2="${y+h/2}" stroke="#8c5a2b" stroke-width="3"/></g>`;}

/* Zwei Kisten mit je einem Pfeil nach rechts (Länge in Kästchen) */
function twoArrowsSVG(a,b,scaleN){
  const W=600,H=230,q=30;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kiste A mit Pfeil von ${a} Kästchen, Kiste B mit Pfeil von ${b} Kästchen">${gridLines(W,H,q)}`;
  [[a,'A',60],[b,'B',150]].forEach(([k,lab,y])=>{s+=crate(90,y-30,60,60);s+=arrow(150,y,150+k*q,y,COL.R,{w:7,head:16});s+=`<text x="60" y="${y+8}" fill="#e2e8f0" font-size="24" font-weight="700" text-anchor="middle">${lab}</text>`;});
  if(scaleN)s+=`<rect x="420" y="190" width="30" height="30" fill="none" stroke="#ffd166" stroke-width="3"/><text x="460" y="212" fill="#ffd166" font-size="16">1 Kästchen = ${scaleN} N</text>`;
  return s+'</svg>';
}
/* Eine Kiste mit einem Pfeil nach links oder rechts */
function singleArrowSVG(k,dir){
  const W=600,H=200,q=30;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kiste mit einem Kraftpfeil von ${k} Kästchen ${dirWord(dir)}">${gridLines(W,H,q)}`;
  s+=crate(270,60,60,60);const x0=dir<0?270:330;s+=arrow(x0,90,x0+dir*k*q,90,dir<0?COL.L:COL.R,{w:7,head:16});
  s+=`<rect x="420" y="150" width="30" height="30" fill="none" stroke="#ffd166" stroke-width="3"/><text x="460" y="172" fill="#ffd166" font-size="16">1 Kästchen = 2 N</text>`;
  return s+'</svg>';
}
/* Statisches Kräftebild für Transferaufgaben (12 px pro N, Maßstab sichtbar) */
function staticForcesSVG(F,o={}){
  const k=o.pxPerN||12,W=600,H=180,cx=300,bw=100,top=40,bh=72,gy=top+bh+8;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="fsvg" role="img" aria-label="${esc(F.filter(f=>f.mag).map(f=>`${fmt(f.mag)} N ${dirWord(f.dir)}`).join(', '))}">`;
  s+=`<line x1="20" y1="${gy}" x2="580" y2="${gy}" stroke="#475569" stroke-width="3"/>`;
  s+=`<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${bh}" rx="8" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>`;
  let iR=0,iL=0;
  F.forEach(f=>{if(!f.mag)return;const i=f.dir>0?iR++:iL++;const y=top+16+i*20;const x0=f.dir>0?cx+bw/2:cx-bw/2;const x1=x0+f.dir*f.mag*k;
    s+=arrow(x0,y,x1,y,f.dir>0?COL.R:COL.L,{w:6,head:14});
    s+=`<text x="${x1+f.dir*8}" y="${y+5}" font-size="15" font-weight="700" fill="${f.dir>0?COL.R:COL.L}" text-anchor="${f.dir>0?'start':'end'}">${fmt(f.mag)} N</text>`;});
  s+=`<line x1="24" y1="${H-18}" x2="${24+2*k}" y2="${H-18}" stroke="#e2e8f0" stroke-width="5"/><text x="${32+2*k}" y="${H-13}" fill="#a3b4cb" font-size="14">= 2 N (Maßstab)</text>`;
  return s+'</svg>';
}
/* Hilfe-Darstellung: Pfeile aneinanderlegen (ohne Zahlen, Striche zählen) */
function chainSVG(F){
  const fs=F.filter(f=>f.mag>0).slice().sort((a,b)=>b.dir-a.dir);
  let pos=0,mn=0,mx=0;const segs=fs.map(f=>{const a=pos;pos+=f.dir*f.mag;mn=Math.min(mn,pos);mx=Math.max(mx,pos);return {a,b:pos,f};});
  const span=Math.max(mx-mn,1),W=600,m=40,k=Math.min(34,(W-2*m)/span),x0=m+(W-2*m-span*k)/2-mn*k,X=v=>x0+v*k;
  const rowH=36,H=44+segs.length*rowH+40,yl=H-30;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chain" role="img" aria-label="Die Kraftpfeile sind aneinandergelegt. Jeder Strich ist 1 N.">`;
  segs.forEach((g,i)=>{const y=38+i*rowH;
    s+=`<line x1="${r1(X(g.a))}" y1="${y-14}" x2="${r1(X(g.a))}" y2="${yl}" stroke="#475569" stroke-dasharray="3 4"/>`;
    s+=arrow(X(g.a),y,X(g.b),y,g.f.dir>0?COL.R:COL.L,{w:7,head:14});
    s+=`<text x="${r1((X(g.a)+X(g.b))/2)}" y="${y-11}" fill="#e2e8f0" font-size="14" text-anchor="middle">${fmt(g.f.mag)} N ${g.f.dir>0?'→':'←'}</text>`;});
  s+=`<line x1="${r1(X(mn)-10)}" y1="${yl}" x2="${r1(X(mx)+10)}" y2="${yl}" stroke="#94a3b8" stroke-width="2"/>`;
  for(let v=Math.floor(mn);v<=Math.ceil(mx);v++)s+=`<line x1="${r1(X(v))}" y1="${yl-6}" x2="${r1(X(v))}" y2="${yl+6}" stroke="#94a3b8" stroke-width="2"/>`;
  s+=`<text x="${r1(X(0))}" y="${yl+22}" fill="#ffd166" font-size="13" text-anchor="middle">Start</text>`;
  s+=`<line x1="${r1(X(pos))}" y1="16" x2="${r1(X(pos))}" y2="${yl}" stroke="${COL.RES}" stroke-width="2" stroke-dasharray="6 4"/><text x="${r1(X(pos))}" y="13" fill="${COL.RES}" font-size="13" text-anchor="middle">Ende</text>`;
  s+=`<text x="${W-10}" y="${H-6}" fill="#a3b4cb" font-size="12" text-anchor="end">Jeder Strich = 1 N</text>`;
  return s+'</svg>';
}

function wireSteppers(root){

    const st=b.closest('.stepper'),inp=st.querySelector('input'),step=+st.dataset.step;

/* =====================================================================

function renderMC(el,q,onFinish){
  let wrongs=0,finished=false,firstPick=null;
  const opts=shuffle(q.options);
  el.innerHTML=`${q.kicker?`<div class="kicker">${q.kicker}</div>`:''}${q.title?`<h2 tabindex="-1">${q.title}</h2>`:''}${q.isTwin?twinNote():''}

   ${q.anim?`<div class="scene"><svg viewBox="0 0 600 260" role="img" aria-label="${esc(q.anim.alt)}"></svg><button type="button" class="secondary play">▶ Szene abspielen</button></div>`:(q.sceneHtml?`<div class="scene">${q.sceneHtml}</div>`:'')}
   ${q.starter?`<p class="starter">Satzanfang: <b>${q.starter}</b></p>`:''}
   <div class="opts" role="group" aria-label="Antworten">${opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}" ${q.anim?'disabled':''}><span class="optkey">${'ABCDE'[k]}</span><span>${o.t}</span></button>`).join('')}</div>
   ${q.anim?'<p class="muted wait">👀 Schau dir zuerst die Szene an.</p>':''}
   <div class="fb" aria-live="polite"></div><div class="extra"></div>`;
  const fb=el.querySelector('.fb'),extra=el.querySelector('.extra'),btns=$$('.opt',el);
  let playBtn=null;
  if(q.anim){
    const svg=el.querySelector('.scene svg');playBtn=el.querySelector('.play');svg.innerHTML=q.anim.draw(0);
    playBtn.onclick=()=>{playBtn.disabled=true;animate(svg,q.anim.draw,q.anim.dur||2800,()=>{playBtn.disabled=false;playBtn.textContent='↺ Szene nochmal abspielen';
      if(!finished)btns.forEach(b=>{if(!b.classList.contains('wrong'))b.disabled=false;});const w=el.querySelector('.wait');if(w)w.remove();});};
  }
  btns.forEach(b=>b.onclick=()=>{
    if(finished)return;const o=opts[+b.dataset.k];if(firstPick===null)firstPick=o.t;
    if(o.ok)return finish(false);
    wrongs++;b.classList.add('wrong');b.disabled=true;b.setAttribute('aria-label',strip(o.t)+' – falsch');
    const remaining=btns.filter(x=>!x.classList.contains('wrong')&&!opts[+x.dataset.k].ok).length;
    const H=q.hints||[];
    if(wrongs>H.length||remaining===0)return finish(true);
    fb.innerHTML=msg('bad',`✘ ${o.fb||'Das stimmt noch nicht.'}`)+msg('hint',`<b>Tipp ${wrongs}:</b> ${H[wrongs-1]}`);
    if(wrongs===2&&playBtn&&!playBtn.disabled)playBtn.click();
  });
  function finish(revealed){
    finished=true;btns.forEach(b=>{b.disabled=true;if(opts[+b.dataset.k].ok)b.classList.add('correct');});
    const pts=revealed?0:(wrongs===0?(q.xp||10):5);
    award(q.id,pts,wrongs===0?(q.isTwin?'Verständnis gesichert':'Beim ersten Versuch richtig'):'Fehler selbst verbessert');
    recordStat(q.id,q.cat,wrongs===0);
    fb.innerHTML=revealed?msg('info',`<b>Erklärung:</b> ${q.reveal}`)+(q.twin?'<p class="muted">Gleich kommt eine neue Aufgabe zur Kontrolle.</p>':'')
      :msg('good',`✔ ${wrongs===0?praise():'Gut verbessert!'} ${q.explain||''}`);
    if(q.term)extra.insertAdjacentHTML('beforeend',`<div class="termcard"><div class="ti">${q.term[0]}</div><div>Fachbegriff: <b>${q.term[1]}</b><br><span class="muted">${q.term[2]}</span></div></div>`);
    if(q.reason)reasonBox(extra,q.reason);
    if(onFinish)onFinish({wrongs,revealed,firstPick,needTwin:wrongs>=2||revealed});
  }
}
function animate(svg,draw,dur,onEnd){
  let t0=null;
  function f(ts){if(!svg.isConnected)return;if(t0===null)t0=ts;const p=Math.min(1,(ts-t0)/dur);svg.innerHTML=draw(p);if(p<1)requestAnimationFrame(f);else if(onEnd)onEnd();}

/* Freiwillige Begründung mit Satzstartern */
function reasonBox(el,r){

/* =====================================================================
   Baustein: Resultierende Kraft bestimmen (Richtung + Betrag getrennt bewertet)
   ===================================================================== */
function makeResHints(F){
  const fs=F.filter(f=>f.mag>0),Rr=fs.filter(f=>f.dir>0),Ll=fs.filter(f=>f.dir<0);
  const sR=Rr.reduce((s,f)=>s+f.mag,0),sL=Ll.reduce((s,f)=>s+f.mag,0),R=sR-sL;
  const lst=a=>a.map(f=>fmt(f.mag)+' N').join(' + ');
  if(!Rr.length||!Ll.length){
    const all=Rr.length?Rr:Ll,d=Rr.length?1:-1,sum=sR+sL;
    return {type:'same',hints:['Zeigen alle Pfeile in dieselbe Richtung oder in entgegengesetzte Richtungen?',
      'Wenn alle Kräfte in dieselbe Richtung ziehen, verstärken sie sich. Schau dir die aneinandergelegten Pfeile an. Musst du addieren oder subtrahieren?',
      `Gleiche Richtung: Du addierst die Beträge. ${lst(all)} = ? Die Richtung bleibt ${dirWord(d)}.`],
      full:`Alle Kräfte zeigen ${dirWord(d)}. Sie verstärken sich: ${lst(all)} = ${fmt(sum)} N. Die resultierende Kraft beträgt ${fmt(sum)} N ${dirWord(d)}.`};
  }
  const multi=Rr.length>1||Ll.length>1;
  const side=`Nach rechts: ${lst(Rr)}${Rr.length>1?' = '+fmt(sR)+' N':''}. Nach links: ${lst(Ll)}${Ll.length>1?' = '+fmt(sL)+' N':''}.`;
  if(R===0)return {type:'eq',hints:[multi?'Fasse zuerst die Kräfte zusammen, die in dieselbe Richtung zeigen. Vergleiche dann rechts und links.':'Vergleiche die Kraft nach rechts mit der Kraft nach links. Sind sie gleich groß?',
      'Die Kräfte wirken gegeneinander. Schau dir die aneinandergelegten Pfeile an: Wo endet der letzte Pfeil?',
      `${multi?side+' ':''}Gleich große Kräfte in entgegengesetzte Richtungen heben sich auf.`],
      full:`${side} ${fmt(sR)} N − ${fmt(sL)} N = 0 N. Die Kräfte sind im Gleichgewicht. Die resultierende Kraft ist 0 N. Es gibt keinen resultierenden Pfeil.`};
  const big=Math.max(sR,sL),small=Math.min(sR,sL),d=Math.sign(R);
  return {type:multi?'multi':'opp',hints:[multi?'Fasse zuerst die Kräfte zusammen, die in dieselbe Richtung zeigen.':'Die Kräfte wirken gegeneinander. Welche Kraft ist stärker?',
    'Wie viel Kraft bleibt übrig, wenn die kleinere Kraft die größere teilweise ausgleicht? Schau dir die aneinandergelegten Pfeile an.',
    `${multi?side+' ':''}Rechne: größere Kraft − kleinere Kraft. Die resultierende Kraft zeigt in Richtung der größeren Kraft.`],
    full:`${side} ${fmt(big)} N − ${fmt(small)} N = ${fmt(big-small)} N. Die stärkere Seite zieht ${dirWord(d)}. Die resultierende Kraft beträgt ${fmt(big-small)} N ${dirWord(d)}.`};
}
function diagnoseRes(F,dir,mag){
  const fs=F.filter(f=>f.mag>0),R=resultant(fs),sR=fs.filter(f=>f.dir>0).reduce((s,f)=>s+f.mag,0),sL=fs.filter(f=>f.dir<0).reduce((s,f)=>s+f.mag,0);
  if(!(sR>0&&sL>0)){
    if(fs.length===2&&mag===Math.abs(fs[0].mag-fs[1].mag)&&mag!==Math.abs(R))return 'Du hast die Kräfte voneinander abgezogen. Zeigen beide Pfeile in dieselbe Richtung oder in entgegengesetzte Richtungen?';
    if(dir!==Math.sign(R))return `Alle Kräfte zeigen ${dirWord(Math.sign(R))}. Wohin zeigt dann die resultierende Kraft?`;
    return null;
  }
  if(mag===sR+sL&&sR+sL!==Math.abs(R))return 'Du hast alle Kräfte addiert. Aber die Kräfte wirken gegeneinander. Welche Kraft ist stärker?';
  if(R===0&&dir!==0)return 'Vergleiche genau: Sind die Kräfte nach rechts und nach links zusammen gleich groß?';
  if(R!==0&&mag===Math.abs(R)&&dir!==Math.sign(R))return 'Der Betrag stimmt! Die resultierende Kraft zeigt aber in Richtung der stärkeren Seite.';
  if(fs.length>2){for(let j=0;j<fs.length;j++){const Rj=resultant(fs.filter((_,i)=>i!==j));if(mag===Math.abs(Rj)&&Rj!==R)return 'Hast du wirklich alle Kräfte berücksichtigt? Zähle die Pfeile noch einmal.';}}
  return null;
}
function resQ(el,q,onFinish){
  const F=q.forces,R=resultant(F),H=makeResHints(F);
  let dir=null,attempts=0,first=null,done=false;
  el.innerHTML=`${q.kicker?`<div class="kicker">${q.kicker}</div>`:''}${q.title?`<h2 tabindex="-1">${q.title}</h2>`:''}${q.isTwin?twinNote():''}${q.text?taskBox(q.text):''}
   ${q.scene==='none'?'':`<div class="scene">${q.scene||staticForcesSVG(F)}</div>`}
   <div class="respick">
     <div class="plabel">Richtung der resultierenden Kraft:</div>
     <div class="seg big" role="group" aria-label="Richtung der resultierenden Kraft"><button type="button" data-d="-1">⬅ nach links</button><button type="button" data-d="0">0 N · kein Pfeil</button><button type="button" data-d="1">nach rechts ➡</button></div>
     <div class="plabel">Betrag:</div>
     <div class="numrow">${stepperHTML('Betrag in Newton',0,99,1)}<span class="unit">N</span></div>
     <button type="button" class="primary chk">${q.btn||'Prüfen'}</button>
   </div><div class="fb" aria-live="polite"></div><div class="vis"></div>`;
  wireSteppers(el);
  const inp=el.querySelector('.stepper input'),fb=el.querySelector('.fb'),vis=el.querySelector('.vis'),chk=el.querySelector('.chk');
  function setDir(d){dir=d;$$('.respick [data-d]',el).forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.d===d)));
    if(d===0)inp.value=0;inp.disabled=d===0;$$('.respick .sbtn',el).forEach(b=>b.disabled=d===0);}
  $$('.respick [data-d]',el).forEach(b=>b.onclick=()=>{if(!done)setDir(+b.dataset.d);});
  chk.onclick=()=>{
    if(done)return;
    if(dir===null){fb.innerHTML=msg('hint','Wähle zuerst eine Richtung.');return;}
    const mag=dir===0?0:readNum(inp);
    if(mag===null){fb.innerHTML=msg('hint','Trage noch den Betrag in N ein.');inp.focus();return;}
    if(dir!==0&&mag===0){fb.innerHTML=msg('hint','Bei 0 N gibt es keinen Pfeil. Wähle dann „0 N · kein Pfeil“.');return;}
    if(!first)first={dir,mag};
    const dOk=dir===Math.sign(R),mOk=mag===Math.abs(R);
    if(dOk&&mOk)return finish(false);
    attempts++;
    if(attempts>=4)return finish(true);
    const diag=diagnoseRes(F,dir,mag);
    const hint=(attempts===1&&diag)?diag:H.hints[attempts-1];
    fb.innerHTML=msg('bad',`${dOk?'✔ Richtung stimmt.':'✘ Richtung: noch nicht richtig.'}<br>${mOk?'✔ Betrag stimmt.':'✘ Betrag: noch nicht richtig.'}`)+msg('hint',`<b>Tipp ${attempts}:</b> ${hint}`);
    if(attempts===2)vis.innerHTML=`<div class="vislabel">Hilfe: Die Pfeile sind aneinandergelegt.</div>${chainSVG(F)}`;
  };
  function finish(revealed){
    done=true;chk.disabled=true;$$('.respick button',el).forEach(b=>b.disabled=true);inp.disabled=true;
    $$('.respick [data-d]',el).forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.d===Math.sign(R))));inp.value=Math.abs(R);
    if(revealed){fb.innerHTML=msg('info',`<b>Erklärung:</b> ${H.full}`);if(!vis.innerHTML)vis.innerHTML=chainSVG(F);}
    else fb.innerHTML=msg('good',`✔ ${attempts===0?praise():'Gut verbessert!'} F_res = ${resText(R)}.${q.explain?' '+q.explain:''}`);
    const pts=revealed?0:(attempts===0?(q.xp||10):5);
    award(q.id,pts,attempts===0?(q.why||'Richtig bestimmt'):'Fehler selbst verbessert');
    recordStat(q.id,q.cat,attempts===0);
    if(onFinish)onFinish({wrongs:attempts,revealed,first,needTwin:attempts>=2||revealed});
  }
}

/* =====================================================================
   Baustein: Mehrere Felder (getrennte Rückmeldung je Feld)
   ===================================================================== */
function fieldsTask(el,t,onFinish){
  let attempts=0,done=false;const vals=t.fields.map(()=>null);
  el.innerHTML=`${t.kicker?`<div class="kicker">${t.kicker}</div>`:''}${t.title?`<h2 tabindex="-1">${t.title}</h2>`:''}${taskBox(t.text)}${t.scene?`<div class="scene">${t.scene}</div>`:''}
   <div class="fields">${t.fields.map((f,i)=>`<div class="fld" data-i="${i}"><div>${f.label}</div><div>${f.type==='number'?`<span class="numrow">${stepperHTML(strip(f.label),0,f.max||9999,f.step||1)}<span class="unit">${f.unit||''}</span></span>`:`<div class="seg" role="group" aria-label="${esc(strip(f.label))}">${f.options.map(o=>`<button type="button" data-v="${o.v}">${o.t}</button>`).join('')}</div>`}</div><div class="fldres" aria-live="polite"></div></div>`).join('')}</div>
   <button type="button" class="primary chk">Prüfen</button><div class="fb" aria-live="polite"></div>`;
  wireSteppers(el);
  const rows=$$('.fld',el),fb=el.querySelector('.fb'),chk=el.querySelector('.chk');
  rows.forEach((row,i)=>{
    $$('[data-v]',row).forEach(b=>b.onclick=()=>{if(done)return;vals[i]=b.dataset.v;$$('[data-v]',row).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
    const inp=row.querySelector('input');if(inp)inp.addEventListener('input',()=>{vals[i]=readNum(inp);});
  });
  chk.onclick=()=>{
    if(done)return;
    rows.forEach((row,i)=>{const inp=row.querySelector('input');if(inp)vals[i]=readNum(inp);});
    if(vals.some(v=>v===null)){fb.innerHTML=msg('hint','Fülle zuerst alle Zeilen aus.');return;}
    const res=t.fields.map((f,i)=>typeof f.answer==='number'?(vals[i]!==null&&Math.abs(vals[i]-f.answer)<1e-9):vals[i]===f.answer);
    if(res.every(Boolean))return finish(false);
    attempts++;if(attempts>=3)return finish(true);
    rows.forEach((row,i)=>{const f=t.fields[i];row.classList.toggle('ok',res[i]);row.classList.toggle('bad',!res[i]);
      row.querySelector('.fldres').innerHTML=res[i]?'✔ richtig':`✘ <b>Tipp:</b> ${f.hints[Math.min(attempts,f.hints.length)-1]}`;});
    fb.innerHTML=msg('bad',`${res.filter(Boolean).length} von ${res.length} richtig. Verbessere die rot markierten Zeilen.`);
  };
  function finish(revealed){
    done=true;chk.disabled=true;
    rows.forEach((row,i)=>{const f=t.fields[i];row.classList.remove('bad');row.classList.add('ok');
      $$('[data-v]',row).forEach(b=>{b.disabled=true;b.setAttribute('aria-pressed',String(b.dataset.v===f.answer));});
      const inp=row.querySelector('input');if(inp){inp.value=f.answer;inp.disabled=true;$$('.sbtn',row).forEach(b=>b.disabled=true);}
      row.querySelector('.fldres').innerHTML=f.ok?`✔ ${f.ok}`:'✔';});
    fb.innerHTML=revealed?msg('info',`<b>Erklärung:</b> ${t.reveal}`):msg('good',`✔ ${attempts===0?praise():'Gut verbessert!'} ${t.explain||''}`);
    const pts=revealed?0:(attempts===0?(t.xp||10):5);
    award(t.id,pts,attempts===0?'Beim ersten Versuch richtig':'Fehler selbst verbessert');
    recordStat(t.id,t.cat,attempts===0);
    if(onFinish)onFinish({wrongs:attempts,revealed,needTwin:attempts>=2||revealed});
  }
}

/* =====================================================================
   Baustein: Kraftpfeil-Labor (Mission 2) – Richtung, Länge, Angriffspunkt
   Maßstab: 1 Kästchen (30 px) = 2 N  →  15 px pro N
   ===================================================================== */
const PTS={L:[240,255,'links'],R:[360,255,'rechts'],T:[300,210,'oben'],C:[300,255,'Mitte']};
const DIRS={L:[-1,0,'⬅ links','nach links'],R:[1,0,'rechts ➡','nach rechts'],U:[0,-1,'⬆ oben','nach oben'],D:[0,1,'⬇ unten','nach unten']};
const PXN=15;
function arrowLab(el,t,onFinish){
  const st={...t.start};let attempts=0,done=false,count=false,dragging=false;
  const ed=t.edit;
  el.innerHTML=`${t.kicker?`<div class="kicker">${t.kicker}</div>`:''}<h2 tabindex="-1">${t.title}</h2>${t.isTwin?twinNote():''}${taskBox(t.text)}
   <div class="lab2"><svg class="labsvg" viewBox="0 0 600 450" role="img" aria-label="Kiste mit Kraftpfeil auf Kästchenpapier"></svg>
   <div class="ctrls">
     <fieldset class="${ed.point?'':'locked'}"><legend>📍 Angriffspunkt ${ed.point?'':'🔒 vorgegeben'}</legend><div class="seg" role="group" aria-label="Angriffspunkt">${Object.keys(PTS).map(k=>`<button type="button" data-p="${k}" ${ed.point?'':'disabled'}>${PTS[k][2]}</button>`).join('')}</div></fieldset>
     <fieldset class="${ed.dir?'':'locked'}"><legend>🧭 Richtung ${ed.dir?'':'🔒 vorgegeben'}</legend><div class="seg" role="group" aria-label="Richtung">${Object.keys(DIRS).map(k=>`<button type="button" data-dir="${k}" ${ed.dir?'':'disabled'}>${DIRS[k][2]}</button>`).join('')}</div></fieldset>
     <fieldset class="${ed.len?'':'locked'}"><legend>📏 Länge ${ed.len?'':'🔒 vorgegeben'}</legend><div class="numrow"><button type="button" class="sbtn lm" aria-label="kürzer" ${ed.len?'':'disabled'}>−</button><input type="range" min="0" max="12" step="1" aria-label="Pfeillänge" ${ed.len?'':'disabled'} style="flex:1"><button type="button" class="sbtn lp" aria-label="länger" ${ed.len?'':'disabled'}>+</button></div><div class="readout" aria-live="polite"></div></fieldset>
     <p class="muted" style="font-size:.85rem">${(ed.dir||ed.len)?'Tipp: Du kannst die Pfeilspitze auch mit dem Finger oder der Maus ziehen.':''}</p>
     <button type="button" class="primary chk">Prüfen</button>
   </div></div><div class="fb" aria-live="polite"></div>`;
  const svg=el.querySelector('.labsvg'),range=el.querySelector('input[type=range]'),readout=el.querySelector('.readout'),fb=el.querySelector('.fb'),chk=el.querySelector('.chk');
  function draw(){
    let s=gridLines(600,450,30,'#1d2d44');
    s+=`<rect x="0" y="300" width="600" height="150" fill="rgba(80,90,110,.18)"/><line x1="0" y1="300" x2="600" y2="300" stroke="#64748b" stroke-width="4"/>`;
    s+=crate(240,210,120,90);
    s+=`<g><rect x="10" y="10" width="232" height="46" rx="8" fill="#0c1420" stroke="#2a3d58"/><text x="22" y="40" fill="#e2e8f0" font-size="17">Maßstab:</text><rect x="104" y="18" width="30" height="30" fill="none" stroke="#ffd166" stroke-width="3"/><text x="142" y="40" fill="#ffd166" font-size="17">= 2 N</text></g>`;
    if(t.extra)s+=t.extra;
    const [ax,ay]=PTS[st.point],[ux,uy]=DIRS[st.dir],len=st.mag*PXN,c=st.dir==='L'?COL.L:st.dir==='R'?COL.R:COL.V;
    if(st.mag>0)s+=arrow(ax,ay,ax+ux*len,ay+uy*len,c,{w:8,head:20});
    if(count&&st.mag>0){for(let i=1;i*2<=st.mag;i++){const cx=ax+ux*(i*30-15),cy=ay+uy*(i*30-15);s+=`<circle cx="${cx-uy*24}" cy="${cy+ux*24}" r="11" fill="#0c1420" stroke="#ffd166"/><text x="${cx-uy*24}" y="${cy+ux*24+5}" fill="#ffd166" font-size="14" text-anchor="middle">${i}</text>`;}}
    Object.keys(PTS).forEach(k=>{const [px,py]=PTS[k];
      if(ed.point)s+=`<circle class="pt" data-pt="${k}" cx="${px}" cy="${py}" r="13" fill="rgba(255,255,255,.12)" stroke="#e2e8f0" stroke-width="2" style="cursor:pointer"/>`;
      if(k===st.point)s+=`<circle cx="${px}" cy="${py}" r="8" fill="#ffffff" stroke="#0c1420" stroke-width="2" pointer-events="none"/>`;});
    if((ed.dir||ed.len)&&st.mag>0)s+=`<circle cx="${ax+ux*len}" cy="${ay+uy*len}" r="17" fill="none" stroke="#e2e8f0" stroke-dasharray="4 4" pointer-events="none"/>`;
    svg.innerHTML=s;
    range.value=st.mag;
    readout.textContent=`Länge: ${fmt(st.mag/2)} Kästchen${t.showN?` = ${st.mag} N`:''}`;
    $$('[data-p]',el).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===st.point)));
    $$('[data-dir]',el).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.dir===st.dir)));
  }
  $$('[data-p]',el).forEach(b=>b.onclick=()=>{if(!done){st.point=b.dataset.p;draw();}});
  $$('[data-dir]',el).forEach(b=>b.onclick=()=>{if(!done){st.dir=b.dataset.dir;draw();}});
  range.addEventListener('input',()=>{if(!done){st.mag=+range.value;draw();}});
  el.querySelector('.lm').onclick=()=>{if(!done){st.mag=Math.max(0,st.mag-1);draw();}};
  el.querySelector('.lp').onclick=()=>{if(!done){st.mag=Math.min(12,st.mag+1);draw();}};
  function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
  function dragTo(e){const p=svgPt(e),[ax,ay]=PTS[st.point],dx=p.x-ax,dy=p.y-ay;
    if(ed.dir){if(Math.hypot(dx,dy)<8)return;st.dir=Math.abs(dx)>=Math.abs(dy)?(dx>=0?'R':'L'):(dy>=0?'D':'U');}
    if(ed.len){const [ux,uy]=DIRS[st.dir];st.mag=Math.max(0,Math.min(12,Math.round((dx*ux+dy*uy)/PXN)));}
    draw();}
  svg.addEventListener('pointerdown',e=>{if(done)return;const pt=e.target.closest&&e.target.closest('.pt');
    if(pt&&ed.point){st.point=pt.dataset.pt;draw();return;}
    if(ed.dir||ed.len){dragging=true;try{svg.setPointerCapture(e.pointerId);}catch(err){}dragTo(e);e.preventDefault();}});
  svg.addEventListener('pointermove',e=>{if(dragging)dragTo(e);});
  svg.addEventListener('pointerup',()=>{dragging=false;});
  svg.addEventListener('pointercancel',()=>{dragging=false;});
  if(!(ed.dir||ed.len))svg.style.touchAction='auto';
  chk.onclick=()=>{
    if(done)return;const T=t.target;const lines=[],wrong=[];
    if(ed.point){if(st.point===T.point)lines.push('✔ Angriffspunkt stimmt.');else{lines.push('✘ Angriffspunkt: noch nicht richtig.');wrong.push('point');}}
    if(ed.dir){if(st.dir===T.dir)lines.push('✔ Richtung stimmt.');else{lines.push('✘ Richtung: noch nicht richtig.');wrong.push('dir');}}
    if(ed.len){if(st.mag===T.mag)lines.push('✔ Länge stimmt.');else{lines.push(`✘ Länge: Der Pfeil ist zu ${st.mag<T.mag?'kurz':'lang'}.`);wrong.push('len');}}
    if(!wrong.length)return finish(false,lines);
    attempts++;if(attempts>=3)return finish(true,lines);
    if(attempts===2&&wrong.includes('len'))count=true;draw();
    fb.innerHTML=msg('bad',lines.join('<br>'))+wrong.map(w=>msg('hint',`<b>Tipp:</b> ${t.hints[w][Math.min(attempts,t.hints[w].length)-1]}`)).join('')+(count?msg('hint','Die gelben Zahlen zählen die Kästchen.'):'');
  };
  function finish(revealed,lines){
    done=true;chk.disabled=true;$$('.ctrls button,.ctrls input',el).forEach(b=>b.disabled=true);
    if(revealed){Object.assign(st,t.target);count=true;}draw();
    fb.innerHTML=revealed?msg('info',`<b>Erklärung:</b> ${t.reveal}`):msg('good',`${lines.join('<br>')}<br>✔ ${attempts===0?praise():'Gut verbessert!'} ${t.explain||''}`);
    const pts=revealed?0:(attempts===0?(t.xp||10):5);
    award(t.id,pts,attempts===0?(t.isTwin?'Verständnis gesichert':'Pfeil beim ersten Versuch richtig'):'Fehler selbst verbessert');
    recordStat(t.id,t.cat||'B',attempts===0);
    if(onFinish)onFinish({wrongs:attempts,revealed,needTwin:attempts>=2||revealed});
  }
  draw();
}

/* =====================================================================
   Baustein: Wagen-Simulation (Mission 3 und 4)
   Physik: a = F_res / m mit m = 25 kg; 100 px = 1 m  →  4 px/s² pro N.
   Keine Reibung, außer sie wird ausdrücklich als Kraft eingetragen.
   ===================================================================== */
function createCartSim(host,o={}){
  const k=o.pxPerN||12,cw=o.cartW||120,ch=70,GY=250,ACC=4,scaleN=o.scaleN||2,maxT=o.maxT||4;
  host.innerHTML=`<div class="sim${o.graph===false?' nograph':''}"><svg class="simsvg" viewBox="0 0 900 300" role="img" aria-label="${esc(o.alt||'Simulation: Wagen mit Kraftpfeilen')}"></svg>${o.graph===false?'':`<div class="simside"><div class="speedo"><div class="sp-top"><span>⏱️ Tempo</span><b class="sp-val">0 m/s</b></div><div class="vbar"><div class="vfill"></div><div class="vzero"></div></div><div class="sp-cap">⬅ nach links · nach rechts ➡</div></div><div class="graphbox"><div class="glabel">Tempo-Diagramm (nach rechts = oben)</div><svg class="graph" viewBox="0 0 300 130" role="img" aria-label="Tempo im Verlauf der Zeit"></svg></div></div>`}</div>`;
  const svg=host.querySelector('.simsvg'),gsvg=host.querySelector('.graph'),spv=host.querySelector('.sp-val'),vfill=host.querySelector('.vfill');
  let x=o.x0||450,v=0,forces=[],showRes=false,hist=[],running=false,raf=0;
  function draw(){
    let s='';
    for(let gx=30;gx<=870;gx+=scaleN*k)s+=`<line x1="${gx}" y1="${GY}" x2="${gx}" y2="${GY+9}" stroke="#334155" stroke-width="2"/>`;
    s+=`<line x1="0" y1="${GY}" x2="900" y2="${GY}" stroke="#64748b" stroke-width="4"/>`;
    s+=`<g><text x="18" y="30" fill="#a3b4cb" font-size="16">Maßstab:</text><line x1="96" y1="25" x2="${96+scaleN*k}" y2="25" stroke="#e2e8f0" stroke-width="6"/><text x="${104+scaleN*k}" y="30" fill="#a3b4cb" font-size="16">= ${scaleN} N</text></g>`;
    if(o.note)s+=`<text x="882" y="30" fill="#a3b4cb" font-size="16" text-anchor="end">${o.note}</text>`;
    const top=GY-26-ch,bot=GY-26,Lx=x-cw/2,Rx=x+cw/2;
    s+=`<rect x="${r1(Lx)}" y="${top}" width="${cw}" height="${ch}" rx="9" fill="#3c4b61" stroke="#cbd5e1" stroke-width="3"/>`;
    s+=`<circle cx="${r1(Lx+24)}" cy="${GY-13}" r="13" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/><circle cx="${r1(Rx-24)}" cy="${GY-13}" r="13" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>`;
    if(o.extras)s+=o.extras(x,top,bot,cw,v);
    const slot={L:0,R:0};
    forces.forEach(f=>{
      if(!f.mag||!f.dir)return;const side=f.attach||(f.dir>0?'R':'L');let x0,y;
      if(side==='B'){x0=x;y=GY+16;}else{x0=side==='R'?Rx:Lx;y=top+16+((f.slot!==undefined)?f.slot:slot[side]++)*19;}
      const x1=x0+f.dir*f.mag*k,c=f.dir>0?COL.R:COL.L;
      s+=arrow(x0,y,x1,y,c,{w:6,head:15});
      const outward=side==='B'||(side==='R'&&f.dir>0)||(side==='L'&&f.dir<0);
      let lx,anchor,ly=y+5;
      if(side==='B'){lx=(x0+x1)/2;anchor='middle';ly=y+26;}
      else if(outward){lx=x1+f.dir*8;anchor=f.dir>0?'start':'end';}
      else{lx=x0-f.dir*8;anchor=f.dir>0?'end':'start';}
      s+=`<text x="${r1(lx)}" y="${ly}" font-size="15" font-weight="700" fill="${c}" text-anchor="${anchor}">${f.label} = ${fmt(f.mag)} N</text>`;
    });
    if(showRes){const R=resultant(forces);
      if(R!==0){const y=top-24;s+=arrow(x,y,x+R*k,y,COL.RES,{w:7,head:16,dash:'12 7'});s+=`<text x="${r1(x+R*k+Math.sign(R)*10)}" y="${y+6}" font-size="17" font-weight="800" fill="${COL.RES}" text-anchor="${R>0?'start':'end'}">F_res = ${fmt(Math.abs(R))} N</text>`;}
      else s+=`<text x="${r1(x)}" y="${top-16}" fill="${COL.RES}" font-size="17" font-weight="800" text-anchor="middle">F_res = 0 N · kein Pfeil</text>`;}
    svg.innerHTML=s;drawSpeed();drawGraph();
  }
  function drawSpeed(){if(!spv)return;const ms=v/100;
    spv.textContent=Math.abs(ms)<0.005?'0 m/s (in Ruhe)':`${fmt2(Math.abs(ms))} m/s ${ms>0?'➡':'⬅'}`;
    const w=Math.min(50,Math.abs(ms)/2.5*50);vfill.style.width=w+'%';vfill.style.left=(ms>=0?50:50-w)+'%';}
  function drawGraph(){if(!gsvg)return;const X=t=>30+t/maxT*262,Y=vv=>65-Math.max(-2.5,Math.min(2.5,vv/100))/2.5*55;
    let s=`<line x1="30" y1="8" x2="30" y2="122" stroke="#64748b"/><line x1="30" y1="65" x2="294" y2="65" stroke="#64748b"/><text x="6" y="20" fill="#a3b4cb" font-size="11">+</text><text x="6" y="118" fill="#a3b4cb" font-size="11">−</text><text x="20" y="69" fill="#a3b4cb" font-size="11" text-anchor="end">0</text><text x="292" y="80" fill="#a3b4cb" font-size="11" text-anchor="end">Zeit</text>`;
    if(hist.length>1)s+=`<polyline points="${hist.map(p=>r1(X(p.t))+','+r1(Y(p.v))).join(' ')}" fill="none" stroke="#e2e8f0" stroke-width="3"/>`;
    gsvg.innerHTML=s;}
  function stop(){cancelAnimationFrame(raf);running=false;}
  function run({v0=0,stopAtRest=false,onEnd}={}){
    stop();x=v0>0?170:v0<0?730:450;v=v0*100;hist=[{t:0,v}];let t=0,last=null;running=true;
    const R=resultant(forces),a=R*ACC;
    function step(ts){
      if(!svg.isConnected){running=false;return;}
      if(last===null){last=ts;raf=requestAnimationFrame(step);return;}
      const dt=Math.min(0.04,(ts-last)/1000);last=ts;t+=dt;
      const vPrev=v;v+=a*dt;let reason=null;
      if(stopAtRest&&vPrev!==0&&((vPrev>0)!==(v>0)||v===0)){v=0;reason='rest';}
      x+=v*dt;const mnX=cw/2+12,mxX=900-cw/2-12;
      if(x<mnX){x=mnX;reason=reason||'edge';}if(x>mxX){x=mxX;reason=reason||'edge';}
      if(t>=maxT)reason=reason||'time';
      hist.push({t,v});draw();
      if(reason){running=false;if(onEnd)onEnd({reason,R,v0,vEnd:v/100});return;}
      raf=requestAnimationFrame(step);
    }
    raf=requestAnimationFrame(step);
  }
  draw();
  return {setForces(f){forces=f;draw();},setShowRes(b){showRes=b;draw();},run,stop,draw,
    reset(){stop();x=o.x0||450;v=0;hist=[];draw();},get running(){return running;}};
}
function observeText(R,v0,res){
  if(res&&res.reason==='rest')return 'Der Wagen ist immer langsamer geworden. Jetzt steht er.';
  let t;
  if(R===0)t=v0===0?'Der Wagen bleibt in Ruhe. Das Tempo bleibt 0 m/s.':`Der Wagen rollt gleich schnell weiter ${dirWord(Math.sign(v0))}. Das Tempo ändert sich nicht.`;
  else if(v0===0||Math.sign(v0)===Math.sign(R))t=`Der Wagen wird immer schneller ${dirWord(Math.sign(R))}.`;
  else t=`Der Wagen wird langsamer${res&&Math.sign(res.vEnd)===Math.sign(R)?', bleibt kurz stehen und rollt dann '+dirWord(Math.sign(R))+' los':''}.`;
  if(res&&res.reason==='edge')t+=' Am Ende der Bahn stoppt der Versuch.';
  return t;
}
/* Kräfte-Regler */
function forcePanel(el,forces,onChange){
  el.innerHTML=forces.map((f,i)=>`<div class="frow" data-i="${i}"><span class="fname">${f.label}</span><div class="seg" role="group" aria-label="Richtung von ${f.label}"><button type="button" data-d="-1">⬅ links</button><button type="button" data-d="1">rechts ➡</button></div><input type="range" min="0" max="10" step="1" aria-label="Betrag von ${f.label} in Newton"><output></output><span class="lock" title="gesperrt">🔒</span></div>`).join('');
  let editable=new Set();const rows=$$('.frow',el);
  function refresh(){rows.forEach((row,i)=>{const f=forces[i],ed=editable.has(i);
    $$('[data-d]',row).forEach(b=>{b.setAttribute('aria-pressed',String(+b.dataset.d===f.dir));b.disabled=!ed;});
    const r=row.querySelector('input');r.value=f.mag;r.disabled=!ed;row.querySelector('output').textContent=f.mag+' N';
    row.classList.toggle('locked',!ed);row.classList.toggle('dirL',f.dir<0);row.classList.toggle('dirR',f.dir>0);});}
  rows.forEach((row,i)=>{
    $$('[data-d]',row).forEach(b=>b.onclick=()=>{forces[i].dir=+b.dataset.d;refresh();onChange&&onChange();});
    row.querySelector('input').addEventListener('input',e=>{forces[i].mag=+e.target.value;refresh();onChange&&onChange();});
  });
  refresh();
  return {setEditable(a){editable=new Set(a);refresh();},refresh};
}

/* =====================================================================
   Mission 3: Kräfteduell – ein Fall im Zyklus
   Vorhersagen → (Bewegung vorhersagen) → Experiment → Beobachten → Erklären → Experimentier-Auftrag → Übertragen
   ===================================================================== */
function duelStep(c){return ctx=>{
  const el=ctx.el;
  const base=()=>c.forces.map((f,i)=>({label:'F'+(i+1),mag:f.mag,dir:f.dir}));
  const forces=base();const R0=resultant(forces);
  el.innerHTML=`<div class="kicker">${c.kicker}</div><h2 tabindex="-1">${c.title}</h2>${taskBox(c.intro)}<div class="simhost"></div><div class="fpanel"></div><div class="flow"></div>`;
  const sim=createCartSim(el.querySelector('.simhost'),{pxPerN:12,note:'Reibung: aus',alt:'Wagen mit Kraftpfeilen'});
  sim.setForces(forces);
  let challengeMode=false;
  const panel=forcePanel(el.querySelector('.fpanel'),forces,()=>{if(challengeMode)sim.setShowRes(false);sim.draw();});
  panel.setEditable([]);
  const flow=el.querySelector('.flow');let n=0;
  function section(title){n++;const s=document.createElement('section');s.className='phase';s.innerHTML=`<h3>${n} · ${title}</h3><div class="pbody"></div>`;flow.appendChild(s);setTimeout(()=>{try{s.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){}},80);return s.querySelector('.pbody');}
  let pred=null,expDone=false;
  resQ(section('Vorhersage'),{id:c.id+'-pred',cat:c.cat,forces:base(),scene:'none',btn:'Vorhersage prüfen',why:'Richtige Vorhersage',
    text:c.predText||'Wohin zeigt die resultierende Kraft? Wie groß ist sie? Entscheide zuerst. Danach startest du den Versuch. 🔒 Die Regler sind noch gesperrt.'},
    r=>{pred=r;if(c.motionQ)renderMC(section('Was passiert mit dem Wagen?'),c.motionQ,()=>experiment());else experiment();});
  function experiment(){
    const b=section('Experiment');let v0=c.v0||0;
    b.innerHTML=`${taskBox(c.expText||'Starte den Versuch. Beobachte den Wagen, den Pfeil F_res und das Tempo.')}
      <div class="seg" role="group" aria-label="Startzustand"><button type="button" data-v="0">Start: Wagen steht</button><button type="button" data-v="1">Start: Wagen rollt nach rechts</button></div>
      <div class="btnrow"><button type="button" class="primary run">▶ Versuch starten</button><button type="button" class="secondary rst">↺ Reset</button></div><div class="obs" aria-live="polite"></div>`;
    const runB=b.querySelector('.run'),obs=b.querySelector('.obs');
    const mark=()=>$$('[data-v]',b).forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.v===v0)));mark();
    $$('[data-v]',b).forEach(x=>x.onclick=()=>{v0=+x.dataset.v;mark();});
    runB.onclick=()=>{
      forces.splice(0,forces.length,...base());panel.setEditable([]);sim.setForces(forces);sim.setShowRes(true);runB.disabled=true;
      sim.run({v0,onEnd:res=>{runB.disabled=false;
        obs.innerHTML=msg('info',`<b>Beobachtung:</b> ${observeText(R0,v0,res)}`)+compare()+
          `<p class="muted">Schau auf das Tempo-Diagramm: Die Kraft bleibt die ganze Zeit gleich. ${R0===0?'Weil F_res = 0 N ist, bleibt das Tempo gleich.':'Das Tempo ändert sich dabei ständig.'} Kraft und Tempo sind nicht dasselbe.</p>`;
        award(c.id+'-exp',5,'Experiment durchgeführt');
        if(!expDone){expDone=true;renderMC(section('Erklären'),c.explainQ,()=>challenge());}
      }});
    };
    b.querySelector('.rst').onclick=()=>{forces.splice(0,forces.length,...base());panel.refresh();sim.setForces(forces);sim.reset();obs.innerHTML='';runB.disabled=false;};
  }
  function compare(){
    const f=pred.first,ok=f.dir===Math.sign(R0)&&f.mag===Math.abs(R0);
    return `<table class="cmp"><tr><th>Vergleich</th><th>Resultierende Kraft</th></tr><tr><td>Deine erste Vorhersage</td><td>${predText(f)} ${ok?'✔':'✘'}</td></tr>${!ok?`<tr><td>Nach den Tipps</td><td>${resText(R0)} ✔</td></tr>`:''}<tr><td>Ergebnis im Versuch</td><td><b>${resText(R0)}</b></td></tr></table>`;
  }
  function challenge(){
    const ch=c.challenge;if(!ch)return transfer();
    const b=section('Experimentier-Auftrag');challengeMode=true;let tries=0;
    b.innerHTML=`${taskBox(ch.text)}<div class="btnrow"><button type="button" class="primary chk">Prüfen und Versuch starten</button><button type="button" class="secondary rst">↺ Reset</button></div><div class="fb" aria-live="polite"></div>`;
    const fb=b.querySelector('.fb'),chk=b.querySelector('.chk');
    function setStart(){forces.splice(0,forces.length,...ch.start.map((f,i)=>({label:'F'+(i+1),mag:f.mag,dir:f.dir})));panel.setEditable(ch.editable);sim.reset();sim.setForces(forces);sim.setShowRes(false);}
    setStart();
    b.querySelector('.rst').onclick=()=>{if(challengeMode){setStart();fb.innerHTML='';}};
    chk.onclick=()=>{
      tries++;const Rn=resultant(forces);sim.setShowRes(true);sim.run({v0:ch.v0||0});
      if(Rn===ch.target){
        challengeMode=false;panel.setEditable([]);chk.disabled=true;b.querySelector('.rst').disabled=true;
        award(c.id+'-ch',tries<=2?10:5,'Korrekt experimentiert');recordStat(c.id+'-ch',c.cat,tries===1);
        fb.innerHTML=msg('good',`✔ Geschafft! F_res = ${resText(Rn)}. ${ch.success||''}`);transfer();
      }else{
        const need=ch.target-Rn;
        fb.innerHTML=msg('bad',`✘ Jetzt ist F_res = ${resText(Rn)}. Ziel: ${resText(ch.target)}.`)+
          msg('hint',`<b>Tipp:</b> ${tries>=2&&ch.hint2?ch.hint2:(need>0?'Es fehlt noch Kraft nach rechts. Ziehe mehr nach rechts oder weniger nach links.':'Es fehlt noch Kraft nach links. Ziehe mehr nach links oder weniger nach rechts.')}`);
      }
    };
  }
  function transfer(){
    resQ(section('Übertragen: neue Aufgabe'),{...c.transfer,id:c.id+'-tr1',cat:c.trCat||c.cat},r=>{
      if((pred.needTwin||r.needTwin)&&c.transfer2)resQ(section('Noch eine neue Aufgabe'),{...c.transfer2,id:c.id+'-tr2',cat:c.trCat||c.cat,isTwin:true},()=>end());
      else end();});
  }
  function end(){const b=section('Fall geschafft ✔');b.innerHTML=msg('good',c.summary);ctx.done();}
}}

function runMission(n){
  const M=MISSIONS[n],queue=M.steps();let i=0;
  function show(){
    app.innerHTML=`<section class="mission"><div class="mhead"><button type="button" class="ghost" id="backHub">← Labor</button><div><div class="kicker">Mission ${n+1} · ${M.time}</div><h1 class="mtitle">${M.icon} ${M.title}</h1></div></div>
      <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${queue.length}" aria-valuenow="${i}"><div style="width:${Math.round(i/queue.length*100)}%"></div></div><div class="pstep">Schritt ${i+1} von ${queue.length}</div>
      <div class="card" id="step"></div><div class="nav"><button type="button" class="primary" id="next" disabled>Weiter ➜</button></div></section>`;
    const next=$('#next');let action=null;
    const ctx={el:$('#step'),done:(label,act)=>{next.disabled=false;if(label)next.textContent=label;action=act||null;next.classList.add('pulse');},insertNext:fn=>queue.splice(i+1,0,fn)};
    next.onclick=()=>{if(action)return action();i++;if(i<queue.length)show();else renderHub();};
    $('#backHub').onclick=()=>renderHub();
    queue[i](ctx);
    const h=$('#step').querySelector('h2');window.scrollTo(0,0);if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}
  }
  show();
}

    <p class="muted center">Gespielte Missionen kannst du wiederholen. Punkte gibt es pro Aufgabe nur einmal.</p>
    <div class="foot"><button type="button" class="ghost" id="teach">👩‍🏫 Für Lehrkräfte</button><button type="button" class="ghost" id="restart">↺ Neu starten</button></div>`;
  $$('[data-m]',app).forEach(b=>b.onclick=()=>runMission(+b.dataset.m));
  $('#bil').onclick=()=>S.post?renderBilanz():renderTest('post');
  $('#teach').onclick=showTeacher;
  $('#restart').onclick=()=>{openModal('Neu starten?','<p>Dein ganzer Spielstand wird gelöscht: Punkte, Abzeichen und Tests.</p><div class="btnrow"><button type="button" class="primary" id="yesR">Ja, alles löschen</button><button type="button" class="secondary" id="noR">Abbrechen</button></div>');$('#yesR').onclick=()=>{S=freshState();save();closeModal();renderStart();};$('#noR').onclick=closeModal;};
  focusHeading();
}
function renderTest(kind){
  const items=kind==='pre'?PRE:POST;let i=0;const ans=[],ok=[];
  function show(){
    const q=items[i];const opts=shuffle(q.options.map((t,j)=>({t,ok:j===0})));opts.push({t:'🤔 Weiß ich noch nicht',ok:false});
    app.innerHTML=`<section class="card narrow"><div class="kicker">${kind==='pre'?'Start-Check':'Abschlusstest'} · Frage ${i+1} von ${items.length}</div><div class="pbar"><div style="width:${Math.round(i/items.length*100)}%"></div></div>
      ${i===0?`<p class="muted">${kind==='pre'?'Hier gibt es keine Punkte und keine Noten. Du zeigst nur, was du schon weißt. Wenn du es nicht weißt, wähle „Weiß ich noch nicht“.':'Jetzt zeigst du, was du gelernt hast. Neue Aufgaben, keine Tipps. Die Auswertung kommt am Ende.'}</p>`:''}
      <h2 tabindex="-1">Frage ${i+1}</h2>${taskBox(q.text)}${q.scene?`<div class="scene">${q.scene}</div>`:''}
      <div class="opts" role="group" aria-label="Antworten">${opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}" aria-pressed="false"><span class="optkey">${'ABCDE'[k]}</span><span>${o.t}</span></button>`).join('')}</div>
      <div class="nav"><button type="button" class="primary" id="tnext" disabled>${i<items.length-1?'Weiter ➜':'Fertig ✔'}</button></div></section>`;
    let sel=null;
    $$('.opt',app).forEach(b=>b.onclick=()=>{sel=+b.dataset.k;$$('.opt',app).forEach(x=>{x.classList.toggle('sel',x===b);x.setAttribute('aria-pressed',String(x===b));});$('#tnext').disabled=false;});
    $('#tnext').onclick=()=>{ans.push(opts[sel].t);ok.push(!!opts[sel].ok);i++;if(i<items.length)show();else finish();};
    focusHeading();
  }
  function finish(){
    const rec={ans,ok,score:ok.filter(Boolean).length};
    if(kind==='pre'){S.pre=rec;save();updateTop();
      app.innerHTML=`<section class="card narrow center"><div class="badgebig" aria-hidden="true">✅</div><h2 tabindex="-1">Start-Check erledigt!</h2><p class="lead">Danke! Jetzt weißt du, worum es geht.</p><p>Mission 1 ist jetzt frei.</p><div class="btnrow" style="justify-content:center"><button type="button" class="primary" id="toHub">Ins Labor ➜</button></div></section>`;
      $('#toHub').onclick=renderHub;focusHeading();}
    else{S.post=rec;save();updateTop();renderBilanz();}
  }
  show();
}
const REC={A:'Wiederhole Mission 1. Merke: Kräfte machen schneller oder langsamer, ändern die Richtung oder verformen.',
  B:'Wiederhole Mission 2. Merke: Anfang = Angriffspunkt, Spitze = Richtung, Länge = Betrag. Achte auf den Maßstab.',
  C1:'Wiederhole Mission 3, Fall A. Merke: Gleiche Richtung – Beträge addieren.',
  C2:'Wiederhole Mission 3, Fall B und D. Merke: Gegeneinander – größere minus kleinere Kraft. F_res zeigt zur stärkeren Seite.',
  C3:'Wiederhole Mission 3, Fall C. Merke: F_res = 0 N – der Körper bleibt in Ruhe oder rollt gleich schnell weiter.',
  D:'Wiederhole Mission 4. Unterscheide immer: Wohin bewegt sich der Körper? Wohin zeigt F_res?',
  E:'Wiederhole Mission 5. Nutze die Formel-Karte: F<sub>G</sub> = m · g mit g = 10 m/s². Gramm durch 1000 teilen. Zum Umstellen: m = F<sub>G</sub> : g.'};
function renderBilanz(){
  updateTop();
  const idx={A:0,B:1,C1:2,C2:3,C3:4,E:5},LV={sicher:'✔ beherrscht',teilweise:'🟡 teilweise sicher',unsicher:'✘ noch unsicher',offen:'– noch keine Daten'};
  const rows=Object.keys(CATS).map(k=>{
    const st=S.stats[k],rate=st.n?st.ok/st.n:null,pick=a=>(a&&a.ok&&a.ok[idx[k]]!==undefined)?a.ok[idx[k]]:null,pOk=(k in idx)?pick(S.post):null,prOk=(k in idx)?pick(S.pre):null;
    let lv;const ev=[pOk,rate===null?null:rate>=0.5].filter(v=>v!==null);
    if(k==='D')lv=rate===null?'offen':rate>=0.6?'sicher':rate>=0.3?'teilweise':'unsicher';
    else if(!ev.length)lv='offen';else{const g=ev.filter(Boolean).length;lv=g===ev.length?'sicher':g>0?'teilweise':'unsicher';}
    return {k,lv,st,pOk,prOk};
  });
  const preS=S.pre?S.pre.score:null,postS=S.post?S.post.score:null;
  let cmp='';
  if(preS!==null&&postS!==null){cmp=`Start-Check: <b>${preS} von ${S.pre.ok.length}</b> richtig. Abschlusstest: <b>${postS} von ${S.post.ok.length}</b> richtig. `+(postS>preS?'Du hast im Abschlusstest mehr Aufgaben gelöst als am Anfang. 👏':postS===preS?'Das sind gleich viele richtige Aufgaben wie am Anfang.':'Im Abschlusstest waren es weniger richtige Aufgaben. Schau dir die Empfehlungen an.');}
  else if(postS!==null)cmp=`Abschlusstest: <b>${postS} von ${S.post.ok.length}</b> richtig. (Kein Start-Check vorhanden – ein Vergleich ist nicht möglich.)`;
  else cmp='Der Abschlusstest wurde noch nicht gemacht.';
  const weak=rows.filter(r=>r.lv==='teilweise'||r.lv==='unsicher');
  const code=`KL-S${preS??'x'}-A${postS??'x'}-XP${S.xp}-M${S.done.map(d=>d?1:0).join('')}${weak.length?'-U:'+weak.map(r=>r.k).join(','):''}`;
  app.innerHTML=`<section class="card"><div class="kicker">Abschluss</div><h1 tabindex="-1">📊 Deine Lernbilanz</h1>
    <p>${cmp}</p><p>⭐ <b>${S.xp} XP</b> · Abzeichen: ${BADGES.map((b,i)=>S.badges[i]?b.icon+' '+b.name:'').filter(Boolean).join(' · ')||'keine'} · Missionen geschafft: ${S.done.filter(Boolean).length} von ${MISSIONS.length}</p>
    <table class="btable"><tr><th>Lernziel</th><th>Start-Check</th><th>Abschlusstest</th><th>In den Missionen<br><span class="muted" style="font-weight:400">(beim 1. Versuch richtig)</span></th><th>Einschätzung</th></tr>
    ${rows.map(r=>`<tr><td>${CATS[r.k]}</td><td>${r.prOk===null?'–':r.prOk?'✔':'✘'}</td><td>${r.pOk===null?'–':r.pOk?'✔':'✘'}</td><td>${r.st.n?`${r.st.ok} von ${r.st.n}`:'–'}</td><td class="lv-${r.lv}">${LV[r.lv]}</td></tr>`).join('')}</table>
    <h2>Empfehlungen</h2>${weak.length?`<ul>${weak.map(r=>`<li><b>${CATS[r.k]}:</b> ${REC[r.k]}</li>`).join('')}</ul>`:'<p>Alle Lernziele sind sicher. Stark! Probiere im freien Labor (Mission 3) eigene Experimente.</p>'}
    ${S.post?`<h2>Abschlusstest – Lösungen</h2><ol>${POST.map((q,i)=>`<li>${q.text}<br>${S.post.ok[i]?'✔':'✘'} Deine Antwort: ${S.post.ans[i]}${S.post.ok[i]?'':` · <b>Richtig: ${q.options[0]}</b>`}</li>`).join('')}</ol>`:''}
    <p>Ergebnis-Code für die Lehrkraft: <span class="code">${code}</span></p>
    <div class="btnrow noprint"><button type="button" class="primary" id="prt">🖨 Drucken / als PDF speichern</button><button type="button" class="secondary" id="hub">🏠 Zurück ins Labor</button><button type="button" class="secondary" id="again">↺ Abschlusstest wiederholen</button></div></section>`;
  $('#prt').onclick=()=>window.print();$('#hub').onclick=renderHub;$('#again').onclick=()=>renderTest('post');
  focusHeading();
}

/* =====================================================================
   Lehrkraft-Bereich und Physik-Selbsttest
   ===================================================================== */
function physicsSelfTest(){
  const T=[['4 N rechts + 6 N rechts',[[4,1],[6,1]],'10 N nach rechts'],['8 N rechts + 3 N links',[[8,1],[3,-1]],'5 N nach rechts'],
    ['5 N rechts + 5 N links',[[5,1],[5,-1]],'0 N (kein Pfeil)'],['2 N links + 7 N links',[[2,-1],[7,-1]],'9 N nach links'],
    ['3 N rechts + 4 N rechts + 2 N links',[[3,1],[4,1],[2,-1]],'5 N nach rechts']];
  return T.map(([d,f,exp])=>{const got=resText(resultant(f.map(([m,dir])=>({mag:m,dir}))));return {desc:d,got,exp,pass:got===exp};});
}
function showTeacher(){
  const tests=physicsSelfTest();
  openModal('👩‍🏫 Für Lehrkräfte',`<div class="guide">
    <p>Das Kraftlabor läuft komplett offline in dieser einen Datei. Es werden keine Daten gesendet. Der Spielstand bleibt erhalten, solange der Browser-Tab offen ist.</p>
    <h3>Ablauf (Doppelstunde, 90 Minuten)</h3><table><tr><th>Zeit</th><th>Teil</th><th>Lernziel</th></tr>
    <tr><td>0–3</td><td>Start-Check (6 Fragen, ohne Rückmeldung)</td><td>Diagnose A–C, E</td></tr>
    <tr><td>3–11</td><td>Mission 1: Kraftdetektive</td><td>A Kraftwirkungen</td></tr>
    <tr><td>11–26</td><td>Mission 2: Kraftpfeil-Labor</td><td>B Kraftpfeile</td></tr>
    <tr><td>26–51</td><td>Mission 3: Kräfteduell (4 Fälle + freies Labor)</td><td>C resultierende Kraft</td></tr>
    <tr><td>51–63</td><td>Mission 4: Meisterprüfung Einkaufswagen</td><td>D Transfer</td></tr>
    <tr><td>63–80</td><td>Mission 5: Gewichtskraft (F<sub>G</sub> = m · g, Einheiten, Umstellen)</td><td>E Gewichtskraft</td></tr>
    <tr><td>80–90</td><td>Abschlusstest (6 Fragen) + Lernbilanz</td><td>A–E</td></tr></table>
    <p>Die Zeiten sind Richtwerte. Schnelle SuS nutzen das freie Labor in Mission 3 oder wiederholen Missionen (ohne doppelte Punkte). Mission 5 ist in drei Niveaus gestuft: ⭐ F<sub>G</sub> aus m berechnen, ⭐⭐ Gramm in Kilogramm umrechnen, ⭐⭐⭐ Formel nach m bzw. g umstellen. Gerechnet wird mit g = 10 m/s² (= 10 N/kg).</p>
    <h3>Auswertung</h3><p>Die Lernbilanz zeigt je Lernziel: Start-Check, Abschlusstest und Erfolgsquote beim ersten Versuch in den Missionen. Drucken oder als PDF speichern ist möglich. Der Ergebnis-Code (z. B. <span class="code">KL-S2-A4-XP260-M1111-U:C2</span>) lässt sich schnell notieren: S = Start-Check, A = Abschlusstest, M = geschaffte Missionen, U = unsichere Lernziele.</p>
    <h3>Fachliche Grenzen</h3><p>Nur Kräfte entlang einer Linie (links/rechts), in Mission 2 zusätzlich oben/unten. Mission 3 ohne Reibung (ideal). Wagenmasse fest (25 kg), daher wird F = m · a nicht thematisiert. Bildschirm-Kästchen sind keine echten Zentimeter. In Mission 4 endet der Versuch beim Stillstand, weil sich die Reibung dann ändert. In Mission 5 wird g = 10 m/s² gerundet (genauer: 9,81 m/s²); der Mondwert 1,6 m/s² ist ebenfalls gerundet.</p>
    <h3>Physik-Selbsttest</h3><ul>${tests.map(t=>`<li>${t.pass?'✔':'✘'} ${t.desc} = ${t.got}</li>`).join('')}</ul>
    <h3>Steuerung</h3><p>Missionen freischalten (z. B. zum Vorführen): Code eingeben.</p>
    <div class="numrow"><input type="text" id="tcode" aria-label="Lehrkraft-Code" placeholder="Code" autocomplete="off"><button type="button" class="secondary" id="tunlock">Alle Missionen freischalten</button></div><div id="tmsg"></div></div>`);
  $('#tunlock').onclick=()=>{if($('#tcode').value.trim().toUpperCase()==='KRAFT'){S.unlockAll=true;save();$('#tmsg').innerHTML=msg('good','Alle Missionen sind freigeschaltet.');renderHub();}else $('#tmsg').innerHTML=msg('bad','Der Code stimmt nicht.');};
}

/* Start */
(function init(){
  const t=physicsSelfTest();
  if(t.some(x=>!x.pass))console.error('Physik-Selbsttest fehlgeschlagen',t);else console.info('Physik-Selbsttest: 5 von 5 bestanden');
  if(S.pre||S.unlockAll)renderHub();else renderStart();
})();
</script>
